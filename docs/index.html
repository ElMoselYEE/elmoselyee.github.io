<style>
/* Layout: an editor shell. Activity rail, explorer, tabbed editor, optional agent panel, status bar. One dark theme, by choice. */
:root {
  --chrome: #0c0e12;
  --side: #111318;
  --editor: #15171c;
  --line: #23272f;
  --hover: #1b1e25;
  --select: #252a34;
  --fg: #d7dae0;
  --muted: #8a92a0;
  --faint: #555c6a;
  --accent: #e9a95f;
  --accent-soft: rgba(233, 169, 95, .14);
  --kw: #e58aa3;
  --str: #a8cc8c;
  --num: #e9a95f;
  --type: #78c2d6;
  --attr: #9fb0f4;
  --com: #5f6777;
  --meta: #c6a0f0;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --lh: 20px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--chrome); color: var(--fg); font: 13px/1.5 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--type); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-rows: 38px minmax(0, 1fr) 24px; height: 100%; }

/* Title bar */
.titlebar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--chrome); }
.tb-left, .tb-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tb-right { justify-content: flex-end; }
.project { font: 500 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.project b { color: var(--fg); font-weight: 500; }
.search-btn { display: flex; align-items: center; gap: 10px; width: min(420px, 42vw); height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--side); color: var(--muted); font-size: 12px; }
.search-btn:hover { border-color: var(--faint); color: var(--fg); }
.search-btn kbd { margin-left: auto; font: 11px var(--mono); color: var(--faint); }
.tb-btn { height: 26px; padding: 0 10px; border-radius: 6px; font: 500 12px var(--mono); color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tb-btn:hover { background: var(--hover); color: var(--fg); }
.tb-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.menu-btn { display: none; }

/* Main area */
.main { display: grid; grid-template-columns: 48px 248px minmax(0, 1fr); min-height: 0; }
.rail { background: var(--chrome); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 2px; }
.rail button { width: 48px; height: 44px; display: grid; place-items: center; color: var(--faint); border-left: 2px solid transparent; }
.rail button:hover { color: var(--fg); }
.rail button[aria-pressed="true"] { color: var(--fg); border-left-color: var(--accent); }
.rail svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.sidebar { background: var(--side); border-right: 1px solid var(--line); overflow: auto; min-width: 0; }
.side-head { height: 34px; display: flex; align-items: center; padding: 0 16px; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tree { list-style: none; margin: 0; padding: 0 0 12px; }
.tree ul { list-style: none; margin: 0; padding: 0; }
.row { width: 100%; display: flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; font-size: 13px; color: var(--muted); text-align: left; white-space: nowrap; }
.row:hover { background: var(--hover); color: var(--fg); }
.row.active { background: var(--select); color: var(--fg); }
.row .chev { width: 12px; font-size: 10px; color: var(--faint); transition: transform .15s; }
.row[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.tree ul .row { padding-left: 28px; }
.fi { font: 600 9.5px var(--mono); width: 22px; text-align: center; flex: none; }
.fname { overflow: hidden; text-overflow: ellipsis; }

.commits { list-style: none; margin: 0; padding: 0 0 12px; }
.commit { width: 100%; text-align: left; padding: 8px 16px; display: grid; gap: 2px; border-left: 2px solid transparent; }
.commit:hover { background: var(--hover); }
.commit .msg { color: var(--fg); font-size: 13px; line-height: 1.35; }
.commit .sub { font: 11px var(--mono); color: var(--faint); }
.commit .sub em { font-style: normal; color: var(--accent); }
.graph { position: relative; padding-left: 16px; }
.graph::before { content: ""; position: absolute; left: 21px; top: 18px; bottom: 26px; width: 1px; background: var(--line); }
.graph .commit { padding-left: 22px; position: relative; }
.graph .commit::before { content: ""; position: absolute; left: 1px; top: 13px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--faint); background: var(--side); }
.graph .commit:first-child::before { border-color: var(--accent); }

/* Workbench */
.work { display: grid; grid-template-rows: 36px 26px minmax(0, 1fr) auto; min-width: 0; min-height: 0; background: var(--editor); }
.tabs { display: flex; background: var(--chrome); overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: flex; align-items: center; gap: 7px; padding: 0 8px 0 12px; height: 36px; border-right: 1px solid var(--line); color: var(--muted); font-size: 12.5px; white-space: nowrap; cursor: pointer; border-top: 1px solid transparent; }
.tab:hover { color: var(--fg); }
.tab.active { background: var(--editor); color: var(--fg); border-top-color: var(--accent); margin-bottom: -1px; }
.tab .x { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; color: var(--faint); font-size: 14px; line-height: 1; visibility: hidden; }
.tab.active .x, .tab:hover .x { visibility: visible; }
.tab .x:hover { background: var(--hover); color: var(--fg); }
.crumbs { display: flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; }
.crumbs span:last-child { color: var(--muted); }

.editor { overflow: auto; position: relative; min-height: 0; }
.code { display: grid; grid-template-columns: auto auto; justify-content: start; font: 13px/var(--lh) var(--mono); padding: 8px 0 48px; position: relative; min-width: max-content; }
.gutter { padding: 0 18px 0 20px; text-align: right; color: var(--faint); user-select: none; white-space: pre; }
.code pre { margin: 0; padding-right: 32px; font: inherit; white-space: pre; position: relative; z-index: 1; }
.hl { position: absolute; left: 0; right: 0; height: var(--lh); background: var(--accent-soft); border-left: 2px solid var(--accent); animation: fade 2.6s ease-out forwards; }
@keyframes fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }

.hljs-keyword, .hljs-selector-tag, .hljs-built_in.hljs-keyword { color: var(--kw); }
.hljs-string, .hljs-regexp { color: var(--str); }
.hljs-number, .hljs-literal { color: var(--num); }
.hljs-title, .hljs-title.class_, .hljs-title.function_, .hljs-type, .hljs-section { color: var(--type); }
.hljs-attr, .hljs-attribute, .hljs-property, .hljs-symbol, .hljs-variable, .hljs-template-variable { color: var(--attr); }
.hljs-built_in { color: var(--type); }
.hljs-comment, .hljs-quote { color: var(--com); font-style: italic; }
.hljs-meta, .hljs-doctag { color: var(--meta); }
.hljs-bullet { color: var(--accent); }
.code a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
.code a:hover { text-decoration-color: currentColor; }

/* Markdown preview */
.preview { max-width: 76ch; padding: 36px clamp(16px, 5vw, 64px) 64px; font-size: 15px; line-height: 1.65; color: var(--fg); }
.preview h1 { font: 600 clamp(30px, 5vw, 44px)/1.05 var(--mono); letter-spacing: -.03em; margin: 0 0 18px; text-wrap: balance; }
.preview h1::before { content: "# "; color: var(--faint); font-weight: 400; }
.preview h2 { font: 600 13px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 40px 0 12px; }
.preview h2::before { content: "## "; color: var(--faint); }
.preview p { margin: 0 0 14px; }
.preview ul { margin: 0 0 14px; padding-left: 0; list-style: none; display: grid; gap: 8px; }
.preview li { position: relative; padding-left: 20px; }
.preview li::before { content: "-"; position: absolute; left: 2px; color: var(--accent); font-family: var(--mono); }
.preview strong { color: #fff; font-weight: 600; }
.preview code { font: 13px var(--mono); background: var(--select); padding: 1px 6px; border-radius: 4px; color: var(--attr); }
.preview .lead { font-size: 18px; color: var(--muted); }
.preview .lead strong { color: var(--fg); }
.preview button.link { color: var(--type); text-decoration: underline; text-underline-offset: 3px; padding: 0; }

/* snake.py */
.game { height: 100%; display: grid; place-items: center; padding: 16px; }
.game canvas { display: block; border: 1px solid var(--line); border-radius: 6px; touch-action: none; cursor: pointer; }

.welcome { height: 100%; display: grid; place-content: center; gap: 12px; color: var(--faint); font: 13px var(--mono); text-align: center; padding: 16px; }
.welcome b { color: var(--muted); font-weight: 500; }

/* Agent panel */
.agent { border-top: 1px solid var(--line); background: var(--chrome); display: grid; grid-template-rows: 32px minmax(0, 1fr) auto; height: clamp(220px, 38vh, 380px); min-height: 0; }
.agent.collapsed { height: 32px; grid-template-rows: 32px; }
.agent.collapsed .agent-log, .agent.collapsed .agent-foot { display: none; }
.agent-head { display: flex; align-items: center; gap: 16px; padding: 0 12px 0 16px; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.agent-head .tabname { color: var(--fg); border-bottom: 1px solid var(--accent); padding-bottom: 3px; }
.agent-head .spacer { flex: 1; }
.agent-head button { width: 24px; height: 24px; border-radius: 4px; color: var(--muted); display: grid; place-items: center; }
.agent-head button:hover { background: var(--hover); color: var(--fg); }
.agent-log { overflow: auto; padding: 8px 16px 12px; font: 13px/1.6 var(--mono); }
.banner { border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin: 4px 0 14px; max-width: 560px; color: var(--muted); }
.banner b { color: var(--accent); font-weight: 600; }
.banner .star { color: var(--accent); }
.msg-user { margin: 14px 0 8px; color: var(--fg); background: var(--side); padding: 4px 10px; border-radius: 4px; display: inline-block; max-width: 100%; }
.msg-user::before { content: "> "; color: var(--faint); }
.step { margin: 6px 0; }
.step .dot { color: var(--accent); }
.step.running .dot { animation: blink .8s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.step .tool { color: var(--fg); font-weight: 600; }
.step .arg { color: var(--muted); }
.step .res { color: var(--faint); padding-left: 18px; white-space: pre-wrap; }
.step .res .hit { color: var(--muted); }
.step .res .hit b { color: var(--type); font-weight: 400; }
.answer { margin: 8px 0 4px; display: grid; grid-template-columns: 18px minmax(0, 1fr); max-width: 86ch; }
.answer .dot { color: var(--fg); }
.answer p { margin: 0 0 8px; }
.answer ul { margin: 0 0 8px; padding: 0; list-style: none; }
.answer li { padding-left: 16px; position: relative; }
.answer li::before { content: "-"; position: absolute; left: 0; color: var(--faint); }
.answer strong { color: #fff; font-weight: 600; }
.answer code { color: var(--attr); }
.answer a { color: var(--type); }
.agent-foot { padding: 8px 16px 10px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.chip:hover:not(:disabled) { color: var(--fg); border-color: var(--faint); }
.chip:disabled { opacity: .4; cursor: default; }
.prompt { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--side); }
.prompt:focus-within { border-color: var(--faint); }
.prompt span { color: var(--accent); font: 600 13px var(--mono); }
.prompt input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font: 13px var(--mono); }
.prompt input::placeholder { color: var(--faint); }

/* Status bar */
.status { display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--side); border-top: 1px solid var(--line); font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; }
.status .spacer { flex: 1; }
.status .branch { color: var(--accent); }

/* Command palette */
.palette-wrap { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: flex; justify-content: center; align-items: flex-start; padding: 64px 16px 16px; z-index: 20; }
.palette { width: min(560px, 100%); background: var(--side); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 18px 48px rgba(0, 0, 0, .5); overflow: hidden; }
.palette input { width: 100%; background: var(--editor); border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; color: var(--fg); font: 14px var(--mono); outline: 0; }
.palette ul { list-style: none; margin: 0; padding: 6px 0; max-height: 320px; overflow: auto; }
.palette li { display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer; color: var(--muted); }
.palette li .dir { color: var(--faint); font-size: 12px; margin-left: 4px; }
.palette li.sel { background: var(--select); color: var(--fg); }

/* Phones: explorer becomes a drawer */
@media (max-width: 760px) {
  .main { grid-template-columns: 44px minmax(0, 1fr); position: relative; }
  .rail button { width: 44px; }
  .sidebar { position: absolute; left: 44px; top: 0; bottom: 0; width: min(280px, 78vw); z-index: 10; box-shadow: 12px 0 32px rgba(0, 0, 0, .45); }
  .sidebar[data-open="false"] { display: none; }
  .project { display: none; }
  .search-btn { width: 100%; }
  .titlebar { grid-template-columns: auto 1fr auto; }
  .search-btn kbd { display: none; }
  .status .opt { display: none; }
  .agent { height: 52vh; }
}
@media (min-width: 761px) {
  .sidebar[data-open="false"] { display: none; }
  .main:has(.sidebar[data-open="false"]) { grid-template-columns: 48px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; transition: none !important; }
}
</style>

const AGENT = false;

const FILES = {
"README.md": { lang: "markdown", src:
`# Blayne Moseley

**Principal Software Engineer at Twilio,** working on agentic memory. Backend engineer and architect: I build high-volume data pipelines, microservice platforms, and the standards that help teams run them well.

- **Now:** leading the agentic memory team at Twilio, building a stable product on top of unstable LLM providers
- **Before that:** storage team at Twilio Segment, inside an ingestion pipeline that handles up to 1 billion events per second
- **Earlier:** ten years at DealerSocket and Solera, growing from senior engineer to enterprise architect
- **Languages, in order:** PHP → Perl → Java → Python → Go

## My story

Hi, I'm Blayne. I got into programming by accident at 14, trying to make my Amazon Associates referral site more dynamic. After a few nights with the PHP manual I looked back and realized this was programming. I've been hooked ever since.

Through high school and college I freelanced, designed, and built e-commerce sites. Along the way I found the work I love most: building APIs and designing systems.

## In this repo

- \`experience/\` has one file per role, written in the language I used most in that job. The enterprise architect years are YAML, which felt right.
- \`skills.json\` is the short version of my stack.

"CLAUDE.md": { lang: "markdown", src:
`# CLAUDE.md

Guidance for Claude Code, and any other agent, working with Blayne.

## Overview

Principal engineer who builds AI products for a living and builds with AI every day.
At Twilio he leads the agentic memory team. At home, agents help run his homelab.
The tools change every few months, and he changes with them.

## How Blayne works with agents

- Agents do real work here: plan, edit, run commands, open pull requests. He reviews
  and merges.
- Context lives in the repo. Every project gets a CLAUDE.md, repeated workflows
  become skills, and lessons learned go into memory.
- Guardrails are designed in: read-only tokens for infrastructure, secrets agents
  never touch, and a diff preview before any config reaches production.
- New models are measured before they're trusted. His own benchmark harness
  (GSM8K, HumanEval-lite) decides which model gets which job.

## AI stack

- **Agents:** Claude Code, daily, at work and at home
- **Routing:** Claude Code Router, picking a local or hosted model per task
- **Local models:** Ollama on his own GPU for fast, free background work
- **Hosted models:** Anthropic, DeepSeek, Qwen and more via OpenRouter and OpenCode Zen
- **Integrations:** MCP servers and CLIs that give agents Home Assistant,
  Google Workspace and personal finance data
- **Glue:** custom request transformers that let one agent talk to many providers

## At work

- Leads the team building agentic memory at Twilio
- Built a stable product on top of unstable LLM providers
- Built a load testing framework now used on half a dozen projects

## Adapting to the landscape

- Tries new tools on real problems, then keeps what earns its place.
- Rebuilds his workflow as often as the tools improve. Nothing is sacred.
- Writes down what works (CLAUDE.md, skills, benchmarks) so each new tool
  starts from what the last one learned.

## Rules

- Benchmark before switching models.
- Never put secrets in a prompt. Tell Blayne which command to run instead.
- Verify, then report. A reload that "succeeded" still gets its logs checked.
- Plain-text math in the terminal. No LaTeX.

## Commands

\`\`\`shell
/model ollama,gemma4:26b                          # local model, no API cost
scripts/eval/check-models.sh                      # is every model responding?
python3 scripts/eval/gsm8k_benchmark.py --model X  # score it before trusting it
\`\`\`` },

const $ = (s) => document.querySelector(s);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const base = (p) => p.split("/").pop();

const icon = (p) => { const [t, c] = ICONS[ext(p)] || ["·", "var(--muted)"]; return `<span class="fi" style="color:${c}">${t}</span>`; };

const narrow = () => matchMedia("(max-width: 760px)").matches;

if (!AGENT) document.querySelectorAll(".agent-only").forEach((el) => el.remove());

/* ---------- tiny markdown ---------- */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  return src.split(/\n{2,}/).map((block) => {
    const lines = block.split("\n");
    if (block.startsWith("# ")) return `<h1>${inline(block.slice(2))}</h1>`;

}

}

function renderCommits() {

    `<li><button class="commit" data-file="${c.file}"><span class="msg">${esc(c.msg)}</span><span class="sub">${c.hash} · ${c.year}${c.tag ? ` · <em>${c.tag}</em>` : ""}</span></button></li>`).join("");
}

  const b = e.target.closest("button[data-file]");
  if (b) { openFile(b.dataset.file); if (narrow()) setSidebar(false); }

/* ---------- sidebar views ---------- */
let view = "files";
function setSidebar(isOpen) { $("#sidebar").dataset.open = String(isOpen); syncRail(); }
function syncRail() {
  const isOpen = $("#sidebar").dataset.open === "true";
  $("#viewFiles").setAttribute("aria-pressed", String(isOpen && view === "files"));
  $("#viewGit").setAttribute("aria-pressed", String(isOpen && view === "git"));

}
$("#viewFiles").onclick = () => toggleView("files");
$("#viewGit").onclick = () => toggleView("git");
$("#railSearch").onclick = () => showPalette();

/* ---------- tabs + editor ---------- */
let tabs = [];
let active = null;
function openFile(p, lines) {
  if (!FILES[p]) return;
  if (!tabs.includes(p)) tabs.push(p);
  active = p;
  renderTabs(); renderEditor(); renderTree();
  if (lines && lines.length) flash(lines);
}
function closeTab(p) {
  const i = tabs.indexOf(p);
  tabs.splice(i, 1);
  if (active === p) active = tabs[Math.min(i, tabs.length - 1)] || null;
  renderTabs(); renderEditor(); renderTree();
}
function renderTabs() {
  $("#tabs").innerHTML = tabs.map((p) => {
    const label = p === "README.md" ? "Preview README.md" : base(p);
    return `<div class="tab${p === active ? " active" : ""}" role="tab" aria-selected="${p === active}" tabindex="0" data-file="${p}">${icon(p)}<span>${label}</span><button class="x" data-close="${p}" aria-label="Close ${base(p)}">×</button></div>`;
  }).join("");
}
$("#tabs").addEventListener("click", (e) => {
  const x = e.target.closest("[data-close]");
  if (x) { e.stopPropagation(); closeTab(x.dataset.close); return; }
  const t = e.target.closest(".tab");
  if (t) openFile(t.dataset.file);
});
$("#tabs").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.dataset.file) openFile(e.target.dataset.file); });

function highlight(f) {
  let html;
  try { html = window.hljs ? hljs.highlight(f.src, { language: f.lang }).value : esc(f.src); }
  catch { html = esc(f.src); }
  return html.replace(/(https:\/\/[^"&<\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function renderEditor() {
  const ed = $("#editor");
  if (playing) playing.unmount();
  if (!active) {
    $("#crumbs").innerHTML = "";
    ed.innerHTML = `<div class="welcome"><b>blayne-moseley</b><span>⌘P  go to file</span>${AGENT ? "<span>✻  ask the agent below</span>" : ""}</div>`;
    $("#stLang").textContent = ""; $("#stLines").textContent = "";
    return;
  }
  const f = FILES[active];
  $("#crumbs").innerHTML = ["blayne-moseley", ...active.split("/")].map((s) => `<span>${esc(s)}</span>`).join('<span>›</span>');
  const n = f.src.split("\n").length;
  $("#stLang").textContent = LANG_NAMES[f.lang];
  $("#stLines").textContent = `${n} lines`;
  if (active === "README.md") {
    let html = md(f.src).replace("<p>", '<p class="lead">');
    const tip = AGENT
      ? `<p>Open any file from the explorer, press <code>⌘P</code>, or <button class="link" data-ask="career">ask the agent</button> below.</p>`
      : `<p>Open any file from the explorer, or press <code>⌘P</code> to jump to one.</p>`;
    html = html.replace("<h2>Education</h2>", tip + "<h2>Education</h2>");
    ed.innerHTML = `<article class="preview">${html}</article>`;
  } else if (f.game) {
    ed.innerHTML = `<div class="game"><canvas aria-label="${base(active)}: a game. Arrow keys or WASD to play, Space to start and pause"></canvas></div>`;
    GAMES[active].mount(ed.querySelector("canvas"));
  } else {
    const nums = Array.from({ length: n }, (_, i) => i + 1).join("\n");
    ed.innerHTML = `<div class="code" id="code"><div class="gutter">${nums}</div><pre><code>${highlight(f)}</code></pre></div>`;
  }
  ed.scrollTop = 0;
}
$("#editor").addEventListener("click", (e) => {
  const b = e.target.closest("[data-ask]");
  if (b && AGENT) { setAgent(true); ask(INTENTS.find((i) => i.id === b.dataset.ask)); }
});
function flash(lines) {
  const code = $("#code");
  if (!code) return;
  lines.forEach((ln) => {
    const d = document.createElement("div");
    d.className = "hl";
    d.style.top = `calc(8px + ${ln - 1} * var(--lh))`;

/* ---------- command palette ---------- */
let sel = 0;
function showPalette() {
  $("#paletteWrap").hidden = false;
  $("#paletteInput").value = "";
  sel = 0; renderPalette();
  $("#paletteInput").focus();
}
function hidePalette() { $("#paletteWrap").hidden = true; }
function matches() {
  const q = $("#paletteInput").value.toLowerCase().trim();
  return Object.keys(FILES).filter((p) => !q || p.toLowerCase().includes(q));
}
function renderPalette() {
  const m = matches();
  sel = Math.min(sel, Math.max(0, m.length - 1));
  $("#paletteList").innerHTML = m.length
    ? m.map((p, i) => `<li class="${i === sel ? "sel" : ""}" data-file="${p}">${icon(p)}${base(p)}<span class="dir">${p.includes("/") ? p.split("/")[0] : ""}</span></li>`).join("")
    : `<li>No matching files</li>`;
}
$("#openPalette").onclick = showPalette;
$("#paletteInput").addEventListener("input", () => { sel = 0; renderPalette(); });
$("#paletteInput").addEventListener("keydown", (e) => {
  const m = matches();
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, m.length - 1); renderPalette(); e.preventDefault(); }
  if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); renderPalette(); e.preventDefault(); }
  if (e.key === "Enter" && m[sel]) { hidePalette(); openFile(m[sel]); }
});
$("#paletteList").addEventListener("click", (e) => {
  const li = e.target.closest("li[data-file]");
  if (li) { hidePalette(); openFile(li.dataset.file); }
});
$("#paletteWrap").addEventListener("click", (e) => { if (e.target.id === "paletteWrap") hidePalette(); });
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "p") { e.preventDefault(); showPalette(); }
  if (e.key === "Escape") hidePalette();
});

/* ---------- games/ ---------- */
// What the games share: canvas sizing, the ready/playing/paused/over states, the loop, keys and touch, the best score
// (kept in this browser) and the text cards drawn over a game that isn't running. A game is a spec for arcade():
// size(w, h) → [w, h], reset(g), update(g, dt), draw(g, ctx), intro(), over(g, best, isNew), status(g, best), and
// optionally press(g, dir) and pointer(g, type, point). It calls g.end(error, record) to finish.
const color = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (list) => list[Math.floor(Math.random() * list.length)];
// -1, 0 or 1: arrow keys, or a finger held on the left or right half of the game
const steer = (g) => (g.held.has("right") - g.held.has("left")) || (g.pointer ? (g.pointer.x < g.W / 2 ? -1 : 1) : 0);
const tapOr = (touch, key) => (narrow() ? touch : key);
const startLine = () => [tapOr("Tap to start", "Press Space to start"), "--faint"];
let playing = null;  // the game on screen

function arcade(spec) {
  let cv = null, ctx, W = 0, H = 0, g = null, state = "ready", raf = 0, last = 0, from = null, isNew = false, best = null;
  try { const v = localStorage.getItem(`${spec.id}-best`); if (v !== null) best = Number(v); } catch {}
  const held = new Set();

  function fit() {
    const box = cv.parentElement.getBoundingClientRect();
    const [w, h] = spec.size(Math.max(240, box.width - 34), Math.max(240, box.height - 34));
    const changed = w !== W || h !== H;
    W = w; H = h;
    const dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = `${W}px`; cv.style.height = `${H}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return changed;
  }
  function fresh() {
    state = "ready";
    g = { W, H, t: 0, score: 0, held, pointer: null, over: false, end, pause };
    spec.reset(g);
  }
  function play() {
    if (state === "playing") return;
    if (state === "over") fresh();
    state = "playing"; last = performance.now();
    cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
  }
  function pause() {
    if (state !== "playing") return;
    state = "paused"; held.clear(); g.pointer = null; cancelAnimationFrame(raf);
    render();
  }
  function end(error, record) {
    state = "over"; g.over = true; g.error = error; held.clear(); g.pointer = null; isNew = false;
    cancelAnimationFrame(raf);
    if (record != null && (best == null || (spec.lower ? record < best : record > best))) {
      best = record; isNew = true;
      try { localStorage.setItem(`${spec.id}-best`, String(best)); } catch {}
    }
  }
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t; g.t += dt;
    spec.update(g, dt);
    render();
    if (state === "playing") raf = requestAnimationFrame(frame);
  }

  function render() {
    if (!cv) return;
    ctx.save(); spec.draw(g, ctx); ctx.restore();
    if (state === "ready") card(spec.intro());
    if (state === "paused") card([["# paused", "--accent", 600], [tapOr("Tap to resume", "Press Space to resume"), "--faint"]]);
    if (state === "over") card([...spec.over(g, best, isNew), [tapOr("Tap to play again", "Press Space to play again"), "--faint"]]);
    $("#stLines").textContent = spec.status(g, best);
  }

      for (const sp of s.sprites) drawSprite(ctx, g, sp, s.p1.x + s.p1.s * sp.offset * HW.road * W / 2, s.p1.y, s.p1.s, s.clip);
      for (const c of carsAt[s.i] || []) {
        const t = (c.z % HW.seg) / HW.seg, p = { x: lerp(s.p1.x, s.p2.x, t), y: lerp(s.p1.y, s.p2.y, t), s: lerp(s.p1.s, s.p2.s, t) };
        drawSprite(ctx, g, { kind: "car", label: c.label, fill: c.fill }, p.x + p.s * c.offset * HW.road * W / 2, p.y, p.s, s.clip);
      }
    }
    // your car, from behind
    const { cw, ch, cy: y0 } = playerCar(W, H), turn = steer(g);
    const cx = W / 2 + turn * 4, cy = y0 + (g.off ? Math.random() * 3 : Math.sin(g.t * 40) * (g.speed > 0 ? 0.6 : 0));
    ctx.fillStyle = "#000"; ctx.fillRect(cx - cw * 0.48, cy + ch * 0.8, cw * 0.2, ch * 0.3); ctx.fillRect(cx + cw * 0.28, cy + ch * 0.8, cw * 0.2, ch * 0.3);
    rounded(ctx, cx - cw / 2, cy + ch * 0.25, cw, ch * 0.7, cw * 0.1, "--accent");
    rounded(ctx, cx - cw * 0.34, cy, cw * 0.68, ch * 0.42, cw * 0.08, "--accent");
    ctx.globalAlpha = 0.7; rounded(ctx, cx - cw * 0.28, cy + ch * 0.06, cw * 0.56, ch * 0.28, cw * 0.05, "--chrome"); ctx.globalAlpha = 1;
    rounded(ctx, cx - cw * 0.44, cy + ch * 0.42, cw * 0.18, ch * 0.13, 2, "--kw");
    rounded(ctx, cx + cw * 0.26, cy + ch * 0.42, cw * 0.18, ch * 0.13, 2, "--kw");
    // HUD
    hud(ctx, [[String(g.year), "--accent"], [ROLES[Object.keys(ROLES).filter((y) => y <= g.year).pop()][1], "--muted"]], 12, 10);
    hud(ctx, [[`${g.time.toFixed(1)} s`, "--fg"], [`${Math.round(g.speed / HW.max * 180)} km/h`, "--muted"]], W - 12, 10, "right");
    if (g.bump > 0) {
      ctx.globalAlpha = Math.min(1, g.bump * 2);
      hud(ctx, [[`hit ${g.bumped}`, "--kw"]], W / 2, 44, "center");
      ctx.globalAlpha = 1;
    }
  },
  intro: () => [
    ["career_highway.rs", "--accent", 600],
    ["Drive from 2010 to HEAD. Dodge the tech debt.", "--fg"],
    [tapOr("Hold the left or right side to steer.", "← → or A D to steer. Gas is automatic."), "--muted"],
    startLine(),
  ],
  over: (g, best, isNew) => [
    ["✓ reached HEAD", "--str", 600],
    [`${g.time.toFixed(1)} s${isNew ? " · new best!" : ""}`, "--fg"],
    [`best ${best.toFixed(1)} s`, "--muted"],
  ],
  status: (g, best) => `${g.time.toFixed(1)} s · best ${best == null ? "—" : `${best.toFixed(1)} s`}`,
};

const sleep = (ms) => new Promise((r) => setTimeout(r, reduced ? 0 : ms));
let busy = false;

function logEl(html, cls) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.innerHTML = html;
  $("#log").appendChild(d);
  scrollLog();
  return d;
}
function scrollLog() { const l = $("#log"); l.scrollTop = l.scrollHeight; }

function grep(pattern, dir) {
  const hits = [];
  Object.keys(FILES).filter((p) => p.startsWith(dir)).forEach((p) => {
    FILES[p].src.split("\n").forEach((line, i) => { if (pattern.test(line)) hits.push({ p, n: i + 1, text: line.trim() }); });
  });
  return hits;
}

async function typeInto(el, html) {
  el.innerHTML = html;
  if (reduced) return;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push([walker.currentNode, walker.currentNode.textContent]);
  nodes.forEach(([n]) => (n.textContent = ""));
  for (const [n, text] of nodes) {
    for (let i = 0; i < text.length; i += 4) {
      n.textContent = text.slice(0, i + 4);
      if (i % 24 === 0) { scrollLog(); await new Promise((r) => setTimeout(r, 12)); }
    }
  }
  scrollLog();
}

async function runStep(s) {
  let head, res = "";
  if (s.tool === "Read") head = `<span class="tool">Read</span><span class="arg">(${esc(s.file)})</span>`;
  if (s.tool === "Bash") head = `<span class="tool">Bash</span><span class="arg">(${esc(s.cmd)})</span>`;
  if (s.tool === "Grep") head = `<span class="tool">Grep</span><span class="arg">(${esc(s.label)}, ${esc(s.dir)})</span>`;
  const el = logEl(`<span class="dot">⏺</span> ${head}`, "step running");
  await sleep(650);
  if (s.tool === "Read") {
    openFile(s.file, s.file === "README.md" ? [] : [1]);
    res = `Read ${FILES[s.file].src.split("\n").length} lines`;
  }
  if (s.tool === "Bash") {
    res = [...COMMITS].reverse().map((c) => `<span class="hit"><b>${c.hash}</b> ${c.year} ${esc(c.msg)}</span>`).join("\n");
    view = "git"; if (!narrow()) setSidebar(true);
  }
  if (s.tool === "Grep") {
    const hits = grep(s.pattern, s.dir);
    const files = [...new Set(hits.map((h) => h.p))];
    res = `Found ${hits.length} lines in ${files.length} files\n` +
      hits.slice(0, 6).map((h) => `<span class="hit"><b>${esc(base(h.p))}:${h.n}</b>  ${esc(h.text.slice(0, 70))}</span>`).join("\n") +
      (hits.length > 6 ? `\n… ${hits.length - 6} more` : "");
    if (files[0]) openFile(files[0], hits.filter((h) => h.p === files[0]).map((h) => h.n));
  }
  el.classList.remove("running");
  el.insertAdjacentHTML("beforeend", `<div class="res">⎿  ${res}</div>`);
  scrollLog();
}

async function ask(intent, text) {
  if (busy) return;
  busy = true; setChips(true);
  logEl(esc(text || intent.chip), "msg-user");
  await sleep(300);
  if (!intent) {
    const a = logEl(`<span class="dot">⏺</span><div></div>`, "answer");
    await typeInto(a.lastChild, md("I'm a scripted preview, so I only know a few things for now. Try one of the suggestions below."));
  } else {
    for (const s of intent.steps) await runStep(s);
    await sleep(250);
    const a = logEl(`<span class="dot">⏺</span><div></div>`, "answer");
    await typeInto(a.lastChild, md(intent.answer));
  }
  busy = false; setChips(false);
}

function setChips(disabled) { document.querySelectorAll(".chip").forEach((c) => (c.disabled = disabled)); }
function setAgent(show) {
  $("#agent").classList.toggle("collapsed", !show);
  $("#agentToggle").setAttribute("aria-pressed", String(show));
  $("#railAgent").setAttribute("aria-pressed", String(show));
}
